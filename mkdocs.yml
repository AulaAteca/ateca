site_name: AULA ATECA
site_description: Documentación del Aula de Tecnología Aplicada (ATECA) del CIFP Villa de Agüimes
site_url: https://aulaateca.github.io/ateca/
repo_url: https://github.com/AulaAteca/ateca

theme:
   name: material
   language: es
   # logo: assets/favicon.svg
   palette:
      - scheme: default
        primary: green
        accent: indigo
        toggle:
           icon: material/toggle-switch-off-outline
           name: Modo oscuro
      - scheme: slate
        primary: pink
        accent: green
        toggle:
           icon: material/toggle-switch
           name: Modo claro
nav:
   - 🏫 Inicio: index.md
   - 🕶️ Gafas VR / AR:
        - VR y AR en el aula: gafas/realidad-virtual-aumentada.md
        - Manual Quest 2: gafas/meta-quest-2.md
        - SimulWind en Quest 2: gafas/simulwind.md
        - Apps VR gratuitas: gafas/apps-vr-gratuitas.md
   - 🖨️ Impresora 3D:
        - Diseño e impresión 3D: impresora/diseno-fabricacion-3d.md
        - Diseños 3D gratuitos: impresora/repositorios-disenos-3d.md
   - 🎙️ Radio y Audio:
        - Radio y audio: radio/radio-audio.md
   - 🎥 Vídeo y Streaming:
        - Vídeo y streaming: video/video-streaming.md
        - ATEM Mini Pro (croma): video/atem-mini-pro-croma.md
        - OBS Studio: video/obs.md
   - 🖼️ Imagen:
        - Edición e impresión: imagen/edicion-imagen-impresion.md
   - 🏠 Domótica:
        - Sonos y domótica: domotica/domotica-automatizacion.md

plugins:
   - search
   - glightbox

extra_css:
   - assets/css/extra.css
   - assets/css/cards.css
   - assets/css/seccion.css
   - assets/css/practica.css
   - assets/css/videos.css

extra_javascript:
   - assets/javascripts/nav-toggle.js

markdown_extensions:
   - admonition
   - attr_list
   - tables
   - pymdownx.details
   - pymdownx.highlight:
        anchor_linenums: false
        use_pygments: true
   - pymdownx.superfences
   - pymdownx.inlinehilite
   - md_in_html
   - pymdownx.tabbed:
        alternate_style: true
   - pymdownx.tasklist:
        custom_checkbox: true
   - pymdownx.emoji:
        emoji_index: !!python/name:material.extensions.emoji.twemoji
        emoji_generator: !!python/name:material.extensions.emoji.to_svg
